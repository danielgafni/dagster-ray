name: CI

# Lint, type checks, docs and the test matrix run as Dagger checks on Dagger Cloud (see .dagger/README.md).
# Dagger Cloud checks gate PRs through the ruleset.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa_success:
    name: QA Success
    runs-on: ubuntu-latest
    # Kept so required-check settings that still name `QA Success` keep passing.
    permissions: {}
    steps:
      - run: echo "Dagger Cloud checks gate PRs through the ruleset."
