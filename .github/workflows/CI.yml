name: CI

# Lint, type checks, docs and the test matrix run as Dagger checks on Dagger Cloud (see .dagger/README.md).
# This job waits for them and reports their result.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DAGGER_VERSION: 1.0.0-beta.20

jobs:
  qa_success:
    name: QA Success
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
      - name: Wait for Dagger Cloud checks
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          call: >-
            wait-for-cloud-checks
            --repo=${{ github.repository }}
            --ref=${{ github.event.pull_request.head.sha || github.sha }}
            --token=env:GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
